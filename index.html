<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Catálogo - Precios y Stock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        
        header { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .search-box { width: 100%; max-width: 400px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin: 10px auto 0 auto; display: block; }
        
        .catalogo-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        
        /* Tarjeta de repuestos optimizada para texto */
        .producto-card { background: white; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; border-left: 5px solid #007bff; }
        .prod-codigo { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; }
        .prod-marca { font-size: 12px; color: #ff5722; font-weight: bold; margin-bottom: 4px; }
        .producto-titulo { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 6px; }
        .prod-descripcion { font-size: 13px; color: #666; margin-bottom: 10px; line-height: 1.4; }
        
        .valores-container { background: #f8f9fa; padding: 8px; border-radius: 6px; margin-bottom: 12px; }
        .producto-precio { font-size: 16px; font-weight: 700; color: #00b154; display: flex; justify-content: space-between; }
        .producto-stock { font-size: 14px; font-weight: 600; color: #444; margin-top: 4px; display: flex; justify-content: space-between; }
        .prod-nota { font-size: 11px; color: #999; font-style: italic; margin-top: 4px; border-top: 1px dashed #ddd; padding-top: 4px; }
        
        .btn-edit { background: #007bff; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 13px; }
        
        /* Modal de Edición */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 360px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-bottom: 5px; font-size: 18px; }
        .modal-content p { font-size: 13px; color: #666; margin-bottom: 15px; }
        .modal-content label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 4px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .btn-guardar { background: #00b154; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-cerrar { background: #aeaeae; color: white; border: none; padding: 8px; width: 100%; border-radius: 6px; margin-top: 8px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <h2>Control de Precios y Cantidades</h2>
        <input type="text" id="buscador" class="search-box" placeholder="🔎 Buscar por Nombre, Código o Marca..." oninput="filtrarProductos()">
    </header>

    <main class="catalogo-container" id="catalogo"></main>

    <div class="modal" id="modalEditar">
        <div class="modal-content">
            <h3 id="editNombreTitulo">Editar Producto</h3>
            <p id="editCodigoSub"></p>
            <input type="hidden" id="editFila">
            
            <label>Nuevo Precio ($):</label>
            <input type="number" id="editPrecio" placeholder="Ej. 15000">
            
            <label>Nueva Cantidad (Stock):</label>
            <input type="number" id="editStock" placeholder="Ej. 10">
            
            <button class="btn-guardar" onclick="guardarCambios()">Guardar en Google Sheets</button>
            <button class="btn-cerrar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        // REEMPLAZA CON TU URL DE GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbwMNCC6nhr2WfyI3xI6U59e4BZ2ypfoY_HOwQmHHtYfwXJn-fhsl438yAyXCpUpuHoG/exec"; 
        
        let productos = [];

        async function cargarProductos() {
            const catalogoDiv = document.getElementById('catalogo');
            catalogoDiv.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color:#666;'>Consultando stock y precios en tiempo real...</p>";
            
            try {
                const response = await fetch(API_URL);
                productos = await response.json();
                renderizarProductos(productos);
            } catch (error) {
                catalogoDiv.innerHTML = "<p style='color:red; text-align:center; grid-column: 1/-1;'>Error de conexión con la hoja de cálculo.</p>";
            }
        }

        function renderizarProductos(lista) {
            const catalogoDiv = document.getElementById('catalogo');
            catalogoDiv.innerHTML = "";
            
            if(lista.length === 0) {
                catalogoDiv.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#999;'>No se encontraron coincidencias.</p>";
                return;
            }

            lista.forEach(prod => {
                catalogoDiv.innerHTML += `
                    <div class="producto-card">
                        <div>
                            <div class="prod-codigo">Item Cód: ${prod.codigo || 'S/C'}</div>
                            <div class="prod-marca">${prod.marca || 'Genérico'}</div>
                            <div class="producto-titulo">${prod.nombre}</div>
                            <div class="prod-descripcion">${prod.descripcion || 'Sin descripción disponible.'}</div>
                        </div>
                        <div>
                            <div class="valores-container">
                                <div class="producto-precio"><span>Precio:</span> <span>$${prod.precio || '0'}</span></div>
                                <div class="producto-stock"><span>Cant. Stock:</span> <span>${prod.stock || '0'} u.</span></div>
                                ${prod.nota ? `<div class="prod-nota">Nota: ${prod.nota}</div>` : ''}
                            </div>
                            <button class="btn-edit" onclick="abrirModal('${prod.fila}', '${prod.nombre}', '${prod.codigo}', '${prod.precio}', '${prod.stock}')">⚙️ Modificar Valores</button>
                        </div>
                    </div>
                `;
            });
        }

        // Buscador inteligente (filtra por Nombre, Código o Marca simultáneamente)
        function filtrarProductos() {
            const termino = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(termino) || 
                p.codigo.toString().toLowerCase().includes(termino) ||
                p.marca.toLowerCase().includes(termino)
            );
            renderizarProductos(filtrados);
        }

        function abrirModal(fila, nombre, codigo, precio, stock) {
            document.getElementById('editFila').value = fila;
            document.getElementById('editNombreTitulo').innerText = nombre;
            document.getElementById('editCodigoSub').innerText = "Código de producto: " + (codigo || 'S/C');
            document.getElementById('editPrecio').value = precio;
            document.getElementById('editStock').value = stock;
            document.getElementById('modalEditar').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalEditar').style.display = 'none';
        }

        async function guardarCambios() {
            const fila = document.getElementById('editFila').value;
            const precio = document.getElementById('editPrecio').value;
            const stock = document.getElementById('editStock').value;

            cerrarModal();
            document.getElementById('catalogo').innerHTML = "<p style='text-align:center; grid-column: 1/-1; color:#00b154; font-weight:bold;'>Guardando cambios en Google Sheets...</p>";

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fila, precio, stock })
            });

            // Recarga tras 2 segundos para dar tiempo de escritura a Google Drive
            setTimeout(cargarProductos, 2000);
        }

        window.onload = cargarProductos;
    </script>
</body>
</html>
