<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interactivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        
        header { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        
        /* Buscador */
        .search-box { width: 100%; max-width: 400px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin: 10px auto; display: block; }
        
        .catalogo-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        
        .producto-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .producto-img { width: 100%; height: 140px; object-fit: cover; background: #eee; border-radius: 8px; }
        .producto-titulo { font-size: 14px; font-weight: 600; margin: 8px 0; }
        .producto-precio { font-size: 16px; font-weight: 700; color: #00b154; }
        
        .btn-edit { background: #007bff; color: white; border: none; padding: 6px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%; }
        
        /* Modal Formulario de Edición */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-bottom: 15px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .btn-guardar { background: #00b154; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cerrar { background: #666; color: white; border: none; padding: 8px; width: 100%; border-radius: 6px; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2>Catálogo de Repuestos</h2>
        <input type="text" id="buscador" class="search-box" placeholder="🔎 Buscar producto..." oninput="filtrarProductos()">
    </header>

    <main class="catalogo-container" id="catalogo"></main>

    <div class="modal" id="modalEditar">
        <div class="modal-content">
            <h3>Editar Producto</h3>
            <input type="hidden" id="editFila">
            <label>Nombre del Producto:</label>
            <input type="text" id="editNombre">
            <label>Precio:</label>
            <input type="text" id="editPrecio">
            <button class="btn-guardar" onclick="guardarCambios()">Guardar en Google Sheets</button>
            <button class="btn-cerrar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        // COLOCA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const API_URL = "TU_URL_DE_APPS_SCRIPT"; 
        
        let productos = [];

        // Cargar productos desde Google Sheets automáticamente
        async function cargarProductos() {
            const catalogoDiv = document.getElementById('catalogo');
            catalogoDiv.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Cargando productos desde la base de datos...</p>";
            
            try {
                const response = await fetch(API_URL);
                productos = await response.json();
                renderizarProductos(productos);
            } catch (error) {
                catalogoDiv.innerHTML = "<p style='color:red;'>Error al cargar los datos del catálogo.</p>";
            }
        }

        function renderizarProductos(lista) {
            const catalogoDiv = document.getElementById('catalogo');
            catalogoDiv.innerHTML = "";
            
            if(lista.length === 0) {
                catalogoDiv.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No se encontraron productos.</p>";
                return;
            }

            lista.forEach(prod => {
                catalogoDiv.innerHTML += `
                    <div class="producto-card">
                        <img src="${prod.imagen || 'https://via.placeholder.com/150'}" class="producto-img">
                        <div class="producto-titulo">${prod.nombre}</div>
                        <div class="producto-precio">$${prod.precio}</div>
                        <button class="btn-edit" onclick="abrirModal('${prod.fila}', '${prod.nombre}', '${prod.precio}')">✏️ Editar</button>
                    </div>
                `;
            });
        }

        // Función del Buscador en tiempo real
        function filtrarProductos() {
            const termino = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(termino));
            renderizarProductos(filtrados);
        }

        // Funciones del Editor Modal
        function abrirModal(fila, nombre, precio) {
            document.getElementById('editFila').value = fila;
            document.getElementById('editNombre').value = nombre;
            document.getElementById('editPrecio').value = precio;
            document.getElementById('modalEditar').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalEditar').style.display = 'none';
        }

        async function guardarCambios() {
            const fila = document.getElementById('editFila').value;
            const nombre = document.getElementById('editNombre').value;
            const precio = document.getElementById('editPrecio').value;

            cerrarModal();
            document.getElementById('catalogo').innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Actualizando Google Sheets...</p>";

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors', // Evita problemas de CORS comunes en Apps Script
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fila, nombre, precio })
            });

            // Recargar datos pasados 2 segundos para dar tiempo a que Google Sheets procese
            setTimeout(cargarProductos, 2000);
        }

        // Iniciar la carga al abrir la página
        window.onload = cargarProductos;
    </script>
</body>
</html>
